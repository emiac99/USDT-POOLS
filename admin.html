</head>

<body>

<h1>ADMIN WINNER PANEL</h1>

<div id="buttonsContainer" style="display:none;">

  <button onclick="pickWinner()">
    Pick Winner
  </button>

</div>
<script>
const SUPABASE_URL = "https://xlxbmhpqclyhetpjhoun.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhseGJtaHBxY2x5aGV0cGpob3VuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NjYzMzksImV4cCI6MjA5NTE0MjMzOX0.CMKA3JzSlC8zTYmNxxCJFJaTuibBgpr7Flcj_P4zVxU";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );

async function startAdmin(){

  const enteredPassword =
    prompt("Enter Admin Password");

  if(!enteredPassword){
    document.body.innerHTML =
      "<h1>Access Denied</h1>";
    return;
  }

  const { data, error } =
    await supabaseClient
      .from("admin_settings")
      .select("*")
      .maybeSingle();

  if(error){
    alert(error.message);
    return;
  }

  if(
    !data ||
    enteredPassword !== data.admin_password
  ){
    document.body.innerHTML =
      "<h1>Access Denied</h1>";
    return;
  }

  document
    .getElementById("buttonsContainer")
    .style.display = "block";
}

async function pickWinner(){

  alert("Button Clicked");

  const { data: entries, error } =
    await supabaseClient
      .from("pool_entries")
      .select("*");

alert("Entries query finished");

  if(error){
    alert(error.message);
    return;
  }

alert("Entries found: " + entries.length);

  if(!entries || entries.length === 0){
    alert("No Entries Found");
    return;
  }

  const winner =
    entries[
      Math.floor(
        Math.random() * entries.length
      )
    ];

  const { data: poolData, error: poolError } =
    await supabaseClient
      .from("Link_pools")
      .select("*")
      .eq("link_number", 1)
      .maybeSingle();

  if(poolError){
    alert(poolError.message);
    return;
  }

  const reward =
    Number(poolData?.pool_amount || 0);

  const { data: userData, error: userError } =
    await supabaseClient
      .from("Users")
      .select("*")
      .eq("email", winner.email)
      .maybeSingle();

  if(userError){
    alert(userError.message);
    return;
  }

  const newBalance =
    Number(userData.balance) + reward;

  const { error: updateError } =
    await supabaseClient
      .from("Users")
      .update({
        balance: newBalance
      })
      .eq("email", winner.email);

  if(updateError){
    alert(updateError.message);
    return;
  }

  await supabaseClient
    .from("Link_pools")
    .update({
      pool_amount: 0
    })
    .eq("link_number", 1);

  await supabaseClient
    .from("pool_entries")
    .delete();

  alert(
    winner.email +
    " won " +
    reward +
    " USDT"
  );
}

startAdmin();
</script>
