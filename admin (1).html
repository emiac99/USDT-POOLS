}

  opacity:0.9;

}

</style>

</head>

<body>

<h1>ADMIN WINNER PANEL</h1>

<div id="buttonsContainer"
style="display:none;">
</div>

<script type="module">

// SUPABASE

const SUPABASE_URL =
"https://xlxbmhpqclyhetpjhoun.supabase.co";

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhseGJtaHBxY2x5aGV0cGpob3VuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NjYzMzksImV4cCI6MjA5NTE0MjMzOX0.CMKA3JzSlC8zTYmNxxCJFJaTuibBgpr7Flcj_P4zVxU";

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

// ADMIN PASSWORD

const enteredPassword =
prompt("Enter Admin Password");

// GET REAL PASSWORD FROM DATABASE

const { data } =
await supabaseClient
  .from("admin_settings")
  .select("*")
  .maybeSingle();

if(
  !data ||
  enteredPassword !== data.admin_password
){

  document.body.innerHTML =
  "<h1>Access Denied</h1>";

}else{

  document
  .getElementById(
    "buttonsContainer"
  ).style.display = "block";

 

  for(let i = 1; i <= 20; i++){

    const btn =
    document.createElement("button");

    btn.innerText =
    "Pick Winner Link " + i;

    btn.onclick = function(){

      pickWinner(i);

    };

    document
    .getElementById(
      "buttonsContainer"
    )
    .appendChild(btn);

  }

}

// PICK WINNER FUNCTION

async function pickWinner(linkNumber){

  alert("Button Clicked");

  // GET ENTRIES

  const { data, error } =
  await supabaseClient
    .from("pool_entries")
    .select("*")
    .eq("link_number", Number(linkNumber));

  if(error){

    alert(error.message);
    return;

  }

  alert(JSON.stringify(data));

  if(!data || data.length === 0){

    alert("No Entries Found");
    return;

  }

  // RANDOM WINNER

  const randomIndex =
  Math.floor(
    Math.random() * data.length
  );

  const winner =
  data[randomIndex];

  alert("Winner Selected");

  // GET POOL

  const { data: poolData, error: poolError } =
  await supabaseClient
    .from("Link_pools")
    .select("*")
    .eq("link_number", Number(linkNumber))
    .maybeSingle();

  if(poolError){

    alert(poolError.message);
    return;

  }

  alert("Pool Found");

  const reward =
  Number(poolData.pool_amount);

  // GET USER

  const { data: userData, error:userError } =
  await supabaseClient
    .from("Users")
    .select("*")
    .eq("email", winner.email)
    .maybeSingle();

  if(userError){

    alert(userError.message);
    return;

  }

  alert("User Found");

  // NEW BALANCE

  const newBalance =
  Number(userData.balance) + reward;

  // UPDATE USER

  const { error:updateError } =
  await supabaseClient
    .from("Users")
    .update({

      balance:newBalance

    })
    .eq("email", winner.email);

  if(updateError){

    alert(updateError.message);
    return;

  }

  alert("Balance Updated");

  // RESET POOL

  await supabaseClient
    .from("Link_pools")
    .update({

      pool_amount:0

    })
    .eq("link_number", Number(linkNumber));

  // DELETE ENTRIES

  await supabaseClient
    .from("pool_entries")
    .delete()
    .eq("link_number", Number(linkNumber));

  alert(

    winner.email +
    " won " +
    reward +
    " USDT"

  );

}

</script>

</body>
</html>
