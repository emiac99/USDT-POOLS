<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Reward Page</title>

<style>

body{

  background:#0f172a;
  color:white;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
  padding:20px;
  text-align:center;

}

.card{

  background:#1e293b;
  padding:30px;
  border-radius:20px;
  width:100%;
  max-width:400px;
  box-shadow:0 0 20px rgba(0,0,0,0.4);

}

h1{

  color:#38bdf8;
  margin-bottom:20px;

}

p{

  color:#cbd5e1;
  font-size:18px;

}

</style>

</head>

<body>

<div class="card">

  <h1 id="title">
    Processing Reward...
  </h1>

  <p id="message">
    Please wait...
  </p>

</div>

<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

// SUPABASE URL

const SUPABASE_URL =
"https://xlxbmhpqclyhetpjhoun.supabase.co";

// SUPABASE KEY

const SUPABASE_KEY =
"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhseGJtaHBxY2x5aGV0cGpob3VuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk1NjYzMzksImV4cCI6MjA5NTE0MjMzOX0.CMKA3JzSlC8zTYmNxxCJFJaTuibBgpr7Flcj_P4zVxU";

// CREATE CLIENT

const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

// GET LINK NUMBER

const params =
new URLSearchParams(
  window.location.search
);

const linkNumber =
Number(
  params.get("link")
);

// GET CURRENT USER EMAIL

const currentEmail =
localStorage.getItem(
  "currentEmail"
);

// TODAY DATE

const today =
new Date().toDateString();

// MAIN FUNCTION

async function rewardUser(){

  // USER NOT LOGGED IN

  if(!currentEmail){

    document.getElementById(
      "title"
    ).innerText =
    "Login Required";

    document.getElementById(
      "message"
    ).innerText =
    "Please login first";

    return;

  }

  // INVALID LINK

  if(!linkNumber){

    document.getElementById(
      "title"
    ).innerText =
    "Invalid Link";

    document.getElementById(
      "message"
    ).innerText =
    "Missing link number";

    return;

  }

  // CHECK IF USER ALREADY COMPLETED TODAY

  const { data: existing } =
  await supabaseClient
    .from("completed_links")
    .select("*")
    .eq("email", currentEmail)
    .eq("link_number", linkNumber)
    .eq("completed_date", today)
    .maybeSingle();

  if(existing){

    document.getElementById(
      "title"
    ).innerText =
    "Already Completed";

    document.getElementById(
      "message"
    ).innerText =
    "You already used this link today";

    return;

  }

  // GET CURRENT POOL

  const { data, error } =
  await supabaseClient
    .from("Link_pools")
    .select("*")
    .eq("link_number", linkNumber)
    .maybeSingle();

  if(error || !data){

    document.getElementById(
      "title"
    ).innerText =
    "Pool Error";

    document.getElementById(
      "message"
    ).innerText =
    "Pool not found";

    return;

  }

  // NEW POOL VALUE

  const newAmount =
  Number(data.pool_amount) + 0.002;

  // UPDATE POOL

  const { error: updateError } =
  await supabaseClient
    .from("Link_pools")
    .update({

      pool_amount:newAmount

    })
    .eq("link_number", linkNumber);

  if(updateError){

    document.getElementById(
      "title"
    ).innerText =
    "Update Failed";

    document.getElementById(
      "message"
    ).innerText =
    updateError.message;

    return;

  }

  // SAVE ENTRY

  await supabaseClient
    .from("pool_entries")
    .insert([{

      email:currentEmail,
      link_number:linkNumber

    }]);

  // SAVE DAILY COMPLETION

  await supabaseClient
    .from("completed_links")
    .insert([{

      email:currentEmail,
      link_number:linkNumber,
      completed_date:today

    }]);

  // GET USER

  const { data:userData } =
  await supabaseClient
    .from("Users")
    .select("*")
    .eq("email", currentEmail)
    .maybeSingle();

  // UPDATE ENTRIES

  if(userData){

    const newEntries =
    Number(userData.entries) + 1;

    await supabaseClient
      .from("Users")
      .update({

        entries:newEntries

      })
      .eq("email", currentEmail);

  }

  // SUCCESS MESSAGE

  document.getElementById(
    "title"
  ).innerText =
  "Reward Added";

  document.getElementById(
    "message"
  ).innerText =
  "0.002 USDT added successfully";

}

// START

rewardUser();

</script>

</body>
</html>
